<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>みったー Profile Book</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;color:#615878;background:linear-gradient(135deg,#f9eaf4,#edf6ff)}header{text-align:center;padding:18px}header h1{margin:0;color:#7866a2;font-family:cursive}.app{width:min(1320px,96%);margin:auto;display:grid;grid-template-columns:350px 1fr;gap:18px}.editor{background:#fffc;border-radius:20px;padding:18px}.g{border-top:1px dashed #d8cee6;margin-top:17px;padding-top:12px}.g h2{font-size:16px;color:#806da2}.f{margin:9px 0}.f label{display:block;font-size:12px;margin-bottom:4px}input,textarea{width:100%;padding:9px;border:1px solid #ddd2e8;border-radius:10px;background:#fffafd}textarea{min-height:55px}.birth{display:grid;grid-template-columns:1fr 1fr;gap:7px}.photoBtn,button{display:block;width:100%;border:0;border-radius:11px;padding:11px;margin-top:8px}.photoBtn{text-align:center;background:#a594c5;color:white}#imageInput{display:none}.save{background:#826fa4;color:#fff}.clear{background:#eee8f3;color:#6e647b}.preview{min-width:0}.scroll{overflow:auto}.book{width:1000px;height:643px;display:grid;grid-template-columns:1fr 1fr;position:relative;overflow:hidden;border-radius:18px;background:white;box-shadow:0 8px 30px #51426633}.book:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:9px;transform:translateX(-50%);background:linear-gradient(90deg,#78658b18,#fff,#78658b18)}.page{position:relative;overflow:hidden;padding:24px 28px;background:radial-gradient(circle at 10% 8%,#dcecff 0,transparent 25%),radial-gradient(circle at 90% 12%,#f7ddea 0,transparent 27%),radial-gradient(circle at 20% 90%,#e9e0fa 0,transparent 28%),#fff}.title{margin:0 0 9px;font:600 25px cursive;color:#705b9f}.sec{font:18px cursive;color:#7763a3;margin:10px 0 6px;border-bottom:2px solid #ead6ed}.top{display:grid;grid-template-columns:102px 1fr;gap:13px}.photo{height:127px;border:2px dashed #ad9aca;border-radius:13px;display:flex;align-items:center;justify-content:center;background:#fff9}.photo img{width:100%;height:100%;object-fit:cover;display:none;border-radius:10px}.name{font-size:17px;font-weight:bold;border-bottom:2px solid #aa9ac7;padding:3px}.sentence,.cloud{font-size:9px;line-height:2}.blank{display:inline-block;min-width:45px;border-bottom:1px solid #a298b5;text-align:center;font-weight:bold}.long{min-width:100px}.cloud{margin-top:7px;padding:6px 9px;border:1px dashed #c8b8da;border-radius:15px;background:#fff9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.card{min-height:37px;padding:5px 7px;border:1px solid #d7c9e7;border-radius:10px;background:#fff9}.pink{border-color:#efc2d7}.wide{grid-column:1/-1}.label{display:block;font-size:7px;color:#8d829b}.ans{font-size:9px;white-space:pre-wrap;word-break:break-word}.box{padding:7px;border:1px dashed #b9a6d4;border-radius:14px;background:#fff8}.chars{position:absolute;right:-8px;bottom:-7px;width:235px;z-index:5;filter:drop-shadow(0 2px 2px #66557722)}.game{padding-right:120px}.free{min-height:65px}.doodle{position:absolute;font:32px cursive;opacity:.25}.d1{right:18px;top:12px;color:#e58ab8}.d2{left:14px;bottom:12px;color:#79abd0}@media(max-width:850px){.app{display:flex;flex-direction:column;padding:0 10px}.preview{order:-1}.book{margin:0}}
</style></head><body><header><h1>みったー Profile Book ♡</h1><small>みんなのこと、もっと知りたい。</small></header><div class="app"><div class="editor"><h2>プロフィールを書く ♡</h2><label class="photoBtn" for="imageInput">📷 写真・イラストを入れる</label><input type="file" id="imageInput" accept="image/*">
<div id="form"></div><button class="save" onclick="downloadProfile()">📷 見開きをPNGで保存</button><button class="clear" onclick="clearProfile()">入力をすべて消す</button></div>
<div class="preview"><div class="scroll"><div class="book" id="book">
<section class="page"><span class="doodle d1">♡</span><span class="doodle d2">☆</span><h1 class="title">♡ My profile ♡</h1><div class="top"><div class="photo"><img id="previewImage"><span id="photoPlaceholder">PHOTO</span></div><div><small>わたし・ぼくの名前は</small><div class="name" id="p-name">なまえ</div><div class="sentence">みんなから <span class="blank long" id="p-nickname">---</span> って呼ばれてるよ ♡<br>誕生日は <span class="blank" id="p-birthMonth">--</span> 月 <span class="blank" id="p-birthDay">--</span> 日だよ♪<br>干支は <span class="blank" id="p-eto">---</span>、血液型は <span class="blank" id="p-blood">---</span> 型！<br>MBTIは <span class="blank" id="p-mbti">---</span>！</div></div></div><div class="cloud">自分では <span class="blank long" id="p-personality">---</span> な性格だと思う！<br>子供の頃の夢は <span class="blank long" id="p-childDream">---</span> だったよ♡</div>
<div class="sec">My favorites ♡</div><div class="grid" id="favorites"></div><div class="sec">Free Space ♡</div><div class="grid"><div class="card free"><span class="label">最近ハマっているもの</span><div class="ans" id="p-boom">---</div></div><div class="card free"><span class="label">なんでも一言！</span><div class="ans" id="p-message">---</div></div></div></section>
<section class="page"><span class="doodle d1">♡</span><h1 class="title">Love & Secret ♡</h1><div class="grid" id="lovegrid"></div><div class="sec">My Oshi ♡</div><div class="box"><div class="grid" id="oshigrid"></div></div><div class="sec">Image game ☆</div><div class="box game"><div class="grid" id="gamegrid"></div></div><img class="chars" src="file_000000005bdc8209842f5ab90847992c.png" alt=""></section>
</div></div></div></div>
<script>
const sections=[
["♡ My profile",[["name","名前"],["birthMonth","誕生月"],["birthDay","誕生日"],["eto","干支"],["blood","血液型"],["mbti","MBTI"],["nickname","みんなから何て呼ばれてる？"],["personality","自分ではどんな性格だと思う？"],["childDream","子供の頃の夢は？"]]],
["☆ My favorites",[["color","好きな色"],["food","好きな食べ物"],["animal","好きな動物"],["music","好きな音楽"],["manga","好きな漫画"],["dramaNow","好きなドラマ【今】"],["dramaOld","好きなドラマ【昔】"]]],
["♡ Love & Secret",[["love","好きな人"],["loveReason","その人のどこが好き？"],["type","好みのタイプ"],["fetish","フェチ部位"],["weakness","弱点"],["situation","弱いシチュ"],["role","あなたは受け攻め？"],["habit","好きな癖"]]],
["♡ My Oshi",[["oshi","あなたの推しは？"],["oshiReason","推しのどこが好き？"],["oshiWord","推しを一言で表すなら？"],["oshiMeet","推しに会えたら何したい？"]]],
["☆ みったーで当てはめて！",[["strongDrink","お酒に一番強そう"],["weakDrink","お酒に一番弱そう"],["island","無人島でも生き残りそう"],["popular","実は一番モテそう"],["travel","一緒に旅行するなら"]]],
["♡ Free Space",[["boom","最近ハマっているもの"],["message","自由に一言！"]]]
];
const form=document.getElementById("form"),fields=[];
sections.forEach(([title,items])=>{const g=document.createElement("div");g.className="g";g.innerHTML="<h2>"+title+"</h2>";items.forEach(([id,label])=>{fields.push(id);const f=document.createElement("div");f.className="f";if(id==="birthMonth"){f.innerHTML='<label>誕生日</label><div class="birth"><input id="birthMonth" placeholder="月" inputmode="numeric"><input id="birthDay" placeholder="日" inputmode="numeric"></div>';g.appendChild(f);return}if(id==="birthDay")return;const multi=["personality","loveReason","type","situation","oshiReason","oshiMeet","message"].includes(id);f.innerHTML="<label>"+label+"</label><"+(multi?"textarea":"input")+" id='"+id+"'"+(id==="role"?" placeholder='自由記入'":"")+"></"+(multi?"textarea":"input")+">";g.appendChild(f)});form.appendChild(g)});
const previewGroups={favorites:[["color","♡ 好きな色"],["food","🍴 好きな食べ物"],["animal","☆ 好きな動物"],["music","♫ 好きな音楽"],["manga","♡ 好きな漫画"],["dramaNow","TV 好きなドラマ・今"],["dramaOld","TV 好きなドラマ・昔"]],lovegrid:[["love","好きな人は…♡"],["loveReason","その人のどこが好き？"],["type","好みのタイプ"],["fetish","フェチ部位"],["weakness","弱点"],["situation","こんなシチュに弱い…"],["role","あなたは受け攻め？"],["habit","好きな癖"]],oshigrid:[["oshi","私の推しは…！"],["oshiWord","推しを一言で表すなら？"],["oshiReason","推しのどこが好き？"],["oshiMeet","推しに会えたら何したい？"]],gamegrid:[["strongDrink","🍺 お酒に一番強そう"],["weakDrink","🥴 お酒に一番弱そう"],["island","🌴 無人島でも生き残りそう"],["popular","♡ 実は一番モテそう"],["travel","✈ 一緒に旅行するなら"]]};
Object.entries(previewGroups).forEach(([box,items])=>{const el=document.getElementById(box);items.forEach(([id,label])=>{const d=document.createElement("div");d.className="card "+(box==="lovegrid"?"pink ":"")+(["type","situation","oshiReason","oshiMeet"].includes(id)?"wide":"");d.innerHTML="<span class='label'>"+label+"</span><div class='ans' id='p-"+id+"'>---</div>";el.appendChild(d)})});
function update(id){const i=document.getElementById(id),o=document.getElementById("p-"+id);if(!i||!o)return;let e="---";if(id==="name")e="なまえ";if(id==="birthMonth"||id==="birthDay")e="--";o.textContent=i.value.trim()||e}
fields.forEach(id=>{const i=document.getElementById(id);if(!i)return;const s=localStorage.getItem("mitter6_"+id);if(s!==null)i.value=s;update(id);i.addEventListener("input",()=>{update(id);localStorage.setItem("mitter6_"+id,i.value)})});
const imageInput=document.getElementById("imageInput"),previewImage=document.getElementById("previewImage"),ph=document.getElementById("photoPlaceholder");imageInput.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader;r.onload=x=>{previewImage.src=x.target.result;previewImage.style.display="block";ph.style.display="none";try{localStorage.setItem("mitter6_image",x.target.result)}catch{}};r.readAsDataURL(f)};const si=localStorage.getItem("mitter6_image");if(si){previewImage.src=si;previewImage.style.display="block";ph.style.display="none"}
async function downloadProfile(){try{const c=await html2canvas(document.getElementById("book"),{scale:2,useCORS:true,backgroundColor:"#fff"}),a=document.createElement("a");a.download="mitter-profile.png";a.href=c.toDataURL("image/png");a.click()}catch{alert("PNG保存に失敗しました。もう一度試してください。")}}
function clearProfile(){if(!confirm("入力を全部消しますか？"))return;fields.forEach(id=>{localStorage.removeItem("mitter6_"+id);const i=document.getElementById(id);if(i)i.value="";update(id)});localStorage.removeItem("mitter6_image");location.reload()}
</script></body></html>
