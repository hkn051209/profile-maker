<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile Maker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #eeeafa;
  color: #55506f;
  font-family:
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

header {
  text-align: center;
  padding: 25px 15px 10px;
}

header h1 {
  margin: 0;
  font-size: 28px;
  color: #8177a9;
  font-weight: 500;
}

header p {
  margin: 7px 0;
  color: #9992b5;
}

.container {
  width: min(1100px, 94%);
  margin: auto;
  display: grid;
  grid-template-columns: 380px 1fr;
  gap: 20px;
  padding-bottom: 40px;
}

.panel {
  background: rgba(255,255,255,.9);
  border-radius: 22px;
  padding: 20px;
  box-shadow: 0 5px 25px rgba(100,90,150,.12);
}

.panel h2 {
  margin-top: 0;
  color: #8177a9;
  font-size: 20px;
}

.field {
  margin-bottom: 13px;
}

.field label {
  display: block;
  font-size: 13px;
  margin-bottom: 5px;
  color: #77718f;
}

.field input,
.field textarea,
.field select {
  width: 100%;
  border: 1px solid #ddd8ee;
  border-radius: 10px;
  padding: 10px;
  font-size: 15px;
  background: #faf9ff;
  color: #55506f;
}

.field textarea {
  min-height: 70px;
  resize: vertical;
}

.image-button {
  display: block;
  width: 100%;
  padding: 11px;
  border-radius: 12px;
  border: 0;
  background: #b9b0df;
  color: white;
  text-align: center;
  cursor: pointer;
  margin-bottom: 15px;
}

#imageInput {
  display: none;
}

button.save {
  width: 100%;
  padding: 13px;
  border: 0;
  border-radius: 13px;
  background: #8d82bd;
  color: white;
  font-size: 16px;
  cursor: pointer;
  margin-top: 10px;
}

.preview-wrap {
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.card {
  width: 100%;
  max-width: 650px;
  min-height: 850px;
  padding: 28px;
  border-radius: 25px;
  background:
    radial-gradient(circle at 15% 10%, #ddd8fa 0, transparent 28%),
    radial-gradient(circle at 90% 15%, #d9ecfa 0, transparent 30%),
    radial-gradient(circle at 40% 90%, #eee4f7 0, transparent 35%),
    #fff;
  box-shadow: 0 8px 30px rgba(90,80,130,.15);
  position: relative;
  overflow: hidden;
}

.card::before {
  content: "";
  position: absolute;
  inset: 10px;
  border: 1px solid rgba(150,140,190,.25);
  border-radius: 20px;
  pointer-events: none;
}

.card-title {
  text-align: center;
  font-family: serif;
  font-size: 35px;
  color: #8177a9;
  margin-bottom: 20px;
}

.profile-top {
  display: flex;
  gap: 22px;
  align-items: center;
  margin-bottom: 22px;
}

.photo {
  width: 145px;
  height: 145px;
  flex-shrink: 0;
  border-radius: 50%;
  background: #e9e5f5;
  border: 5px solid white;
  box-shadow: 0 4px 15px rgba(80,70,120,.15);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.photo span {
  color: #aaa4bd;
  font-size: 13px;
}

.basic {
  flex: 1;
}

.name {
  font-size: 28px;
  color: #625b83;
  font-weight: bold;
  margin-bottom: 10px;
}

.info {
  line-height: 1.8;
  font-size: 14px;
}

.section {
  margin-top: 18px;
}

.section-title {
  font-family: serif;
  font-size: 22px;
  color: #8177a9;
  border-bottom: 1px solid #dcd7ee;
  padding-bottom: 5px;
  margin-bottom: 9px;
}

.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.box {
  background: rgba(245,243,252,.8);
  border-radius: 9px;
  padding: 9px;
  min-height: 45px;
}

.box small {
  display: block;
  color: #9b95ad;
  font-size: 11px;
}

.box span {
  color: #5e5878;
}

.free {
  min-height: 100px;
  white-space: pre-wrap;
}

@media (max-width: 800px) {
  .container {
    grid-template-columns: 1fr;
  }

  .preview-wrap {
    order: -1;
  }

  .card {
    min-height: auto;
  }
}

@media (max-width: 480px) {
  .profile-top {
    flex-direction: column;
    text-align: center;
  }

  .info-grid {
    grid-template-columns: 1fr;
  }

  .card {
    padding: 20px;
  }
}
</style>
</head>

<body>

<header>
  <h1>My Profile Maker</h1>
  <p>自分だけのプロフィールシートを作ろう</p>
</header>

<div class="container">

  <!-- 入力欄 -->
  <div class="panel">

    <h2>プロフィールを入力</h2>

    <label class="image-button" for="imageInput">
      📷 プロフィール画像を選ぶ
    </label>
    <input type="file" id="imageInput" accept="image/*">

    <div class="field">
      <label>名前</label>
      <input id="name" placeholder="例：ユーリ">
    </div>

    <div class="field">
      <label>誕生日</label>
      <input id="birthday" placeholder="例：9月29日">
    </div>

    <div class="field">
      <label>年齢</label>
      <input id="age" placeholder="例：15歳">
    </div>

    <div class="field">
      <label>星座</label>
      <input id="zodiac" placeholder="例：天秤座">
    </div>

    <div class="field">
      <label>血液型</label>
      <input id="blood" placeholder="例：A型">
    </div>

    <div class="field">
      <label>身長</label>
      <input id="height" placeholder="例：153cm">
    </div>

    <div class="field">
      <label>性格</label>
      <input id="personality" placeholder="例：生意気で自由奔放">
    </div>

    <div class="field">
      <label>趣味</label>
      <input id="hobby" placeholder="例：昼寝">
    </div>

    <div class="field">
      <label>特技</label>
      <input id="skill" placeholder="例：木登り">
    </div>

    <div class="field">
      <label>好きな食べ物</label>
      <input id="food" placeholder="例：肉">
    </div>

    <div class="field">
      <label>好きな飲み物</label>
      <input id="drink" placeholder="例：ミルク">
    </div>

    <div class="field">
      <label>好きな色</label>
      <input id="color" placeholder="例：銀色">
    </div>

    <div class="field">
      <label>好きな動物</label>
      <input id="animal" placeholder="例：狼">
    </div>

    <div class="field">
      <label>好きな音楽</label>
      <input id="music" placeholder="例：ロック">
    </div>

    <div class="field">
      <label>もし生まれ変わるなら</label>
      <input id="reborn" placeholder="自由に入力">
    </div>

    <div class="field">
      <label>幸せを感じる瞬間</label>
      <input id="happy" placeholder="自由に入力">
    </div>

    <div class="field">
      <label>最近の良い思い出</label>
      <textarea id="memory" placeholder="自由に入力"></textarea>
    </div>

    <div class="field">
      <label>Free Space</label>
      <textarea id="free" placeholder="自由に書いてね"></textarea>
    </div>

    <button class="save" onclick="saveImage()">
      ✨ プロフィール画像を保存
    </button>

  </div>


  <!-- プレビュー -->
  <div class="preview-wrap">

    <div class="card" id="profileCard">

      <div class="card-title">
        My profile
      </div>

      <div class="profile-top">

        <div class="photo">
          <img id="previewImage" style="display:none;">
          <span id="photoText">PHOTO</span>
        </div>

        <div class="basic">

          <div class="name" id="p-name">
            あなたの名前
          </div>

          <div class="info">
            誕生日：<span id="p-birthday">---</span><br>
            年齢：<span id="p-age">---</span><br>
            星座：<span id="p-zodiac">---</span><br>
            血液型：<span id="p-blood">---</span><br>
            身長：<span id="p-height">---</span>
          </div>

        </div>

      </div>


      <div class="section">

        <div class="section-title">
          About me
        </div>

        <div class="info-grid">

          <div class="box">
            <small>性格</small>
            <span id="p-personality">---</span>
          </div>

          <div class="box">
            <small>趣味</small>
            <span id="p-hobby">---</span>
          </div>

          <div class="box">
            <small>特技</small>
            <span id="p-skill">---</span>
          </div>

          <div class="box">
            <small>好きな食べ物</small>
            <span id="p-food">---</span>
          </div>

        </div>

      </div>


      <div class="section">

        <div class="section-title">
          My favorites
        </div>

        <div class="info-grid">

          <div class="box">
            <small>飲み物</small>
            <span id="p-drink">---</span>
          </div>

          <div class="box">
            <small>好きな色</small>
            <span id="p-color">---</span>
          </div>

          <div class="box">
            <small>好きな動物</small>
            <span id="p-animal">---</span>
          </div>

          <div class="box">
            <small>音楽</small>
            <span id="p-music">---</span>
          </div>

        </div>

      </div>


      <div class="section">

        <div class="section-title">
          If...
        </div>

        <div class="box">
          生まれ変わるなら……
          <span id="p-reborn">---</span>
        </div>

      </div>


      <div class="section">

        <div class="section-title">
          Questions
        </div>

        <div class="box">
          幸せを感じる瞬間は？
          <span id="p-happy">---</span>
        </div>

      </div>


      <div class="section">

        <div class="section-title">
          Free Space
        </div>

        <div class="box free" id="p-free">
          自由に書いてね
        </div>

      </div>


      <div class="section">

        <div class="box free" id="p-memory">
          最近の良い思い出
        </div>

      </div>

    </div>

  </div>

</div>


<script>

const fields = [
  "name",
  "birthday",
  "age",
  "zodiac",
  "blood",
  "height",
  "personality",
  "hobby",
  "skill",
  "food",
  "drink",
  "color",
  "animal",
  "music",
  "reborn",
  "happy",
  "memory",
  "free"
];

fields.forEach(id => {

  const input = document.getElementById(id);
  const output = document.getElementById("p-" + id);

  input.addEventListener("input", () => {

    output.textContent =
      input.value || "---";

  });

});


document.getElementById("imageInput")
.addEventListener("change", function(event) {

  const file = event.target.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {

    const img = document.getElementById("previewImage");
    const text = document.getElementById("photoText");

    img.src = e.target.result;
    img.style.display = "block";
    text.style.display = "none";

  };

  reader.readAsDataURL(file);

});


function saveImage() {

  window.print();

}

</script>

</body>
</html>
