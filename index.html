<style>
*{box-sizing:border-box}body{margin:0;background:#e9e9f4;color:#5e5a78;font-family:"Yu Gothic",sans-serif}header{position:sticky;top:0;z-index:9;background:#fffdf9ee;border-bottom:1px solid #d8d4e5;padding:9px;text-align:center}button{border:1px solid #c9c4dc;background:#fff;border-radius:18px;padding:8px 12px;color:#625d82;font-weight:bold}button.main{background:#8178ae;color:#fff}main{max-width:1050px;margin:auto;padding:12px}.title{text-align:center;font-family:serif;font-size:38px;margin:9px 0 0;color:#746da4}.sub{text-align:center;font-size:12px;margin-bottom:12px}.note{max-width:700px;margin:0 auto 12px;background:#fff8fb;border:1px solid #ead9e2;border-radius:12px;padding:9px;font-size:11px}.layout{display:grid;grid-template-columns:1fr 470px;gap:15px;align-items:start}.editor{background:#f5f3fa;padding:10px;border-radius:15px}section,.photoBox{background:#fffef9;border:1px solid #d9d5e2;box-shadow:3px 3px 0 #d6d2df;padding:15px;margin-bottom:12px}section h2{font-family:serif;margin:0 0 10px;color:#7770a5;border-bottom:3px double #c7c1da}label{display:grid;grid-template-columns:42% 58%;align-items:end;font-size:12px;font-weight:bold;margin:7px 0}input[type=text],textarea{border:0;border-bottom:1.5px solid #aaa5bf;background:transparent;color:#514d68;padding:5px 2px;width:100%;outline:0;font:inherit}textarea{min-height:38px;resize:vertical}.photoBox{text-align:center;border-style:dashed}.preview{position:sticky;top:62px}#sheet{background:#fffef9;border:1px solid #d4d0df;box-shadow:6px 7px 0 #cfccda;padding:17px;overflow:hidden}.sheetTitle{font:700 27px serif;text-align:center;color:#716a9f;border-bottom:3px double #c1bcd5;padding-bottom:7px}.sheetTop{display:grid;grid-template-columns:105px 1fr;gap:12px;align-items:center;margin:12px 0}#avatar{width:105px;height:105px;border:2px solid #bbb6cf;background:#f1eff6;display:flex;align-items:center;justify-content:center;font-size:10px;overflow:hidden}#avatar img{width:100%;height:100%;object-fit:cover}#pvName{font: </style></head><body><header>みったー PROFILE BOOK ♡　<button onclick="saveData()">保存</button> <button onclick="loadData()">読込</button> <button class="main" onclick="saveImage()">完成画像</button></header><main><div class="title">みったー</div><div class="sub">紙のプロフィール帳みたいに書いてね ♡</div><div class="note">🔒 ネット用です。本名・住所・電話番号・勤務先など、個人を特定できる情報は書かないでね。</div><div class="layout"><div class="editor"><div class="photoBox">📷 プロフィール画像<br><input id="photo" type="file" accept="image/*"></div><section><h2>PROFILE</h2><label><span>名前・ハンドルネーム</span><input id="name" type="text"></label><label><span>誕生日</span><input id="birthday" type="text"></label><label><span>MBTI</span><input id="mbti" type="text"></label><label><span>星座</span><input id="zodiac" type="text"></label><label><span>干支</span><input id="eto" type="text"></label><label><span>血液型</span><input id="blood" type="text"></label><label><span>利き手</span><input id="hand" type="text"></label><label><span>あだ名・呼ばれ方</span><input id="nickname" type="text"></label><label><span>性格</span><textarea id="personality"></textarea></label><label><span>休日の過ごし方</span><input id="holiday" type="text"></label><label><span>趣味</span><input id="hobby" type="text"></label><label><span>特技</span><input id="skill" type="text"></label><label><span>SNS・活動場所（任意）</span><input id="sns" type="text"></label></section><section><h2>LOVE</h2><label><span>好きな人</span><input id="lovePerson" type="text"></label><label><span>好みのタイプ</span><input id="type" type="text"></label><label><span>好きになるきっかけ</span><input id="trigger" type="text"></label><label><span>一目惚れする？</span><input id="firstLove" type="text"></label><label><span>追う派？追われたい？</span><input id="chase" type="text"></label><label><span>告白する派？されたい？</span><input id="confess" type="text"></label><label><span>年上・同い年・年下？</span><input id="ageType" type="text"></label><label><span>甘える派？甘えられたい？</span><input id="sweet" type="text"></label><label><span>独占欲は強い？</span><input id="possessive" type="text"></label><label><span>嫉妬するタイプ？</span><input id="jealous" type="text"></label><label><span>恋愛するとどうなる？</span><textarea id="loveMode"></textarea></label><label><span>理想のデート</span><textarea id="date"></textarea></label><label><span>恋愛で譲れないこと</span><textarea id="loveRule"></textarea></label><label><span>恋人にされて嬉しいこと</span><textarea id="happy"></textarea></label><label><span>恋人に言われたい言葉</span><input id="wanted" type="text"></label><label><span>あなたは受け攻め？</span><input id="role" type="text"></label></section><section><h2>推し &amp; FAVORITES</h2><label><span>推し</span><input id="oshi" type="text"></label><label><span>推しの好きなところ</span><textarea id="oshiWhy"></textarea></label><label><span>好きな漫画</span><input id="manga" type="text"></label><label><span>好きなアニメ</span><input id="anime" type="text"></label><label><span>好きなキャラクター</span><input id="character" type="text"></label><label><span>好きなドラマ（今）</span><input id="dramaNow" type="text"></label><label><span>好きなドラマ（昔）</span><input id="dramaOld" type="text"></label><label><span>好きな映画</span><input id="movie" type="text"></label><label><span>好きな音楽</span><input id="music" type="text"></label><label><span>好きな色</span><input id="color" type="text"></label><label><span>好きな食べ物</span><input id="food" type="text"></label><label><span>好きな動物</span><input id="animal" type="text"></label><label><span>好きな人と推しは同じ？</span><input id="same" type="text"></label></section><section><h2>ちょっと聞きたい♡</h2><label><span>フェチ・好きな部位</span><input id="fetish" type="text"></label><label><span>好きな声</span><input id="voice" type="text"></label><label><span>好きな仕草</span><input id="gesture" type="text"></label><label><span>好きな癖</span><input id="habit" type="text"></label><label><span>弱点</span><input id="weak" type="text"></label><label><span>弱いシチュエーション</span><textarea id="weakScene"></textarea></label><label><span>されるとドキッとすること</span><textarea id="dokidoki"></textarea></label><label><span>色気を感じる瞬間</span><input id="sexy" type="text"></label><label><span>好きなシチュエーション</span><textarea id="scene"></textarea></label><label><span> <script>const sections={"PROFILE": [["name", "名前・ハンドルネーム"], ["birthday", "誕生日"], ["mbti", "MBTI"], ["zodiac", "星座"], ["eto", "干支"], ["blood", "血液型"], ["hand", "利き手"], ["nickname", "あだ名・呼ばれ方"], ["personality", "性格"], ["holiday", "休日の過ごし方"], ["hobby", "趣味"], ["skill", "特技"], ["sns", "SNS・活動場所（任意）"]], "LOVE": [["lovePerson", "好きな人"], ["type", "好みのタイプ"], ["trigger", "好きになるきっかけ"], ["firstLove", "一目惚れする？"], ["chase", "追う派？追われたい？"], ["confess", "告白する派？されたい？"], ["ageType", "年上・同い年・年下？"], ["sweet", "甘える派？甘えられたい？"], ["possessive", "独占欲は強い？"], ["jealous", "嫉妬するタイプ？"], ["loveMode", "恋愛するとどうなる？"], ["date", "理想のデート"], ["loveRule", "恋愛で譲れないこと"], ["happy", "恋人にされて嬉しいこと"], ["wanted", "恋人に言われたい言葉"], ["role", "あなたは受け攻め？"]], "推し & FAVORITES": [["oshi", "推し"], ["oshiWhy", "推しの好きなところ"], ["manga", "好きな漫画"], ["anime", "好きなアニメ"], ["character", "好きなキャラクター"], ["dramaNow", "好きなドラマ（今）"], ["dramaOld", "好きなドラマ（昔）"], ["movie", "好きな映画"], ["music", "好きな音楽"], ["color", "好きな色"], ["food", "好きな食べ物"], ["animal", "好きな動物"], ["same", "好きな人と推しは同じ？"]], "ちょっと聞きたい♡": [["fetish", "フェチ・好きな部位"], ["voice", "好きな声"], ["gesture", "好きな仕草"], ["habit", "好きな癖"], ["weak", "弱点"], ["weakScene", "弱いシチュエーション"], ["dokidoki", "されるとドキッとすること"], ["sexy", "色気を感じる瞬間"], ["scene", "好きなシチュエーション"], ["secretLike", "人には言いにくい好きなもの"], ["secret", "ここだけの秘密♡"]], "IF...": [["reborn", "生まれ変わるなら？"], ["magic", "魔法が使えたら？"], ["month", "一か月休みになったら？"], ["money", "300万円当たったら？"], ["island", "無人島に1つ持っていくなら？"], ["invisible", "1日だけ透明人間になったら？"]], "QUESTIONS": [["adult", "大人になったと感じる瞬間"], ["happyMoment", "幸せを感じる瞬間"], ["motto", "座右の銘・好きな言葉"], ["good", "自分の好きなところ"], ["bad", "自分の直したいところ"], ["selfAnimal", "自分を動物に例えるなら？"], ["manual", "自分の取扱説明書"], ["mistake", "最近のやらかし"], ["laugh", "最近一番笑ったこと"], ["memory", "最近の良い思い出"]], "みったーの○○な人": [["p1", "一番朝が弱そうな人"], ["p2", "一番寝落ちしそうな人"], ["p3", "一番酒が強そうな人"], ["p4", "一番酔うと変わりそうな人"], ["p5", "一番モテそうな人"], ["p6", "一番恋愛すると重そうな人"], ["p7", "一番嫉妬深そうな人"], ["p8", "一番独占欲が強そうな人"], ["p9", "一番甘え上手そうな人"], ["p10", "一番甘やかし上手そうな人"], ["p11", "一番押しに弱そうな人"], ["p12", "一番押しが強そうな人"], ["p13", "一番照れ屋そうな人"], ["p14", "一番色気がありそうな人"], ["p15", "一番ギャップがありそうな人"], ["p16", "一番秘密が多そうな人"], ["p17", "一番意外な趣味がありそうな人"], ["p18", "一番一緒に旅行したい人"], ["p19", "一番一緒に飲みたい人"], ["p20", "一番デートしてみたい人"], ["p21", "一番相談しやすそうな人"], ["p22", "一番頼りになりそうな人"], ["p23", "一番面白い人"], ["p24", "一番変人そうな人"]], "OTHER": [["theme", "好きなテーマ"], ["best3", "BEST 3"], ["gift", "もらえるとうれしいプレゼント"], ["challenge", "チャレンジしてみたいこと"], ["want", "今ほしいもの"], ["place", "今一番行きたい場所"], ["year", "今年やりたいこと"], ["someday", "いつかやってみたいこと"], ["free", "Free Space"]]};const val=id=>(document.getElementById(id)?.value||"").trim();const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));function render(){document.getElementById("pvName").textContent=val("name")||"NAME";document.getElementById("pvMini").textContent=(val("birthday")||"誕生日")+" ／ MBTI "+(val("mbti")||"");let out="";for(const [t,a] of Object.entries(sections)){const f=a.filter(x=>val(x[0]));if(!f.length)continue;out+=`<div class="psec"><h3>${esc(t)}</h3><div class="pgrid">`;for(const [id,l] of f)out+=`<div class="pitem"><b>${esc(l)}：</b>${esc(val(id))}</div>`;out+="</div></div>"}document.getElementById("previewContent").innerHTML=out}document.querySelectorAll("input[type=text],textarea").forEach(e=>e.addEventListener("input",render));document.getElementById("photo").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>document.getElementById("avatar").innerHTML=`<img src="${r.result}">`;r.readAsDataURL(f)});function saveData(){let d={};document.querySelectorAll("input[type=text],textarea").forEach(e=>d[e.id]=e.value);localStorage.setItem("mittaPaper",JSON.stringify(d));alert("保存したよ♡")}function loadData(){const d=JSON.parse(localStorage.getItem("mittaPaper")||"{}");Object.entries(d).forEach(([k,v])=>{let e=document.getElementById(k);if(e)e.value=v});render();alert("読み込んだよ♡")}async function saveImage(){if(!window.html2canvas)return alert("少し待ってからもう一度押してね");const c=await html2canvas(document.getElementById("sheet"),{scale:2,backgroundColor:"#fffef9"});const a=document.createElement("a");a.download="mitta-profile.png";a.href=c.toDataURL();a.click()}render();</script><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script></body></html>
