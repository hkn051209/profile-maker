<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>みったー PROFILE BOOK</title><style>*{box-sizing:border-box}body{margin:0;background:#eef0ff;color:#555;font-family:"Yu Gothic",sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.title{text-align:center;color:#7374ad;font:30px serif}.sub{text-align:center;color:#999;margin:8px 0 15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel,.book{background:#fffdfd;border:2px solid #d9d7f5;border-radius:24px;box-shadow:0 8px 25px #aaa3}.panel{padding:18px}.panel h2,.section h3{color:#7772aa;font-family:serif}label{display:block;margin:9px 0 4px;font-weight:bold;color:#777}input,textarea{width:100%;border:1px solid #d9d9ec;border-radius:10px;padding:10px;background:#fafaff;font:inherit}textarea{min-height:65px}.two,.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}.photo{border:2px dashed #c9c6ee;border-radius:18px;padding:12px;text-align:center}.preview{padding:15px}.book{padding:18px;background:linear-gradient(135deg,#f8f4ff,#eef8ff,#fff)}.bookhead{display:flex;gap:14px;align-items:center;border-bottom:2px solid #dddaf3;padding-bottom:14px}.avatar{width:105px;height:105px;border-radius:20px;object-fit:cover;background:#eee;border:5px solid white}.name{font:30px serif;color:#6968a5}.birthday{color:#8b89b0}.section{margin-top:14px}.section h3{margin:7px 0}.card{background:#ffffffaa;border:1px solid #deddf1;border-radius:10px;padding:8px;min-height:44px}.q{font-size:11px;color:#9290aa}.a{margin-top:3px;white-space:pre-wrap;word-break:break-word}.small{font-size:12px;color:#999}button{border:0;border-radius:12px;padding:11px 15px;background:#8585c7;color:white;font-weight:bold;margin:5px 3px}.actions{text-align:center}.alt{background:#dddaf5;color:#666}@media(max-width:800px){.grid{grid-template-columns:1fr}.preview{order:-1}.avatar{width:85px;height:85px}.name{font-size:25px}}</style></head><body><div class="wrap"><div class="title">みったー PROFILE BOOK</div><div class="sub">大人のためのプロフィール帳 ― 好きなこと、こっそり教えてね ―</div><div class="grid"><div class="panel"><h2>My profile</h2><div class="photo">プロフィール画像<br><input id="photo" type="file" accept="image/*"></div><div class="two"><div><label>名前・ハンドルネーム</label><input id="name"></div><div><label>誕生日</label><input id="birthday" placeholder="○月○日"></div></div><div class="two"><div><label>星座</label><input id="zodiac"></div><div><label>干支</label><input id="eto"></div></div><div class="two"><div><label>血液型</label><input id="blood"></div><div><label>利き手</label><input id="hand"></div></div><label>あだ名・呼ばれ方</label><input id="nickname"><label>性格</label><textarea id="personality"></textarea><label>休日の過ごし方</label><textarea id="holiday"></textarea><div class="two"><div><label>趣味</label><input id="hobby"></div><div><label>特技</label><input id="skill"></div></div><label>SNS・活動場所（任意）</label><input id="sns"><hr><h2>♡ LOVE</h2><div id="love"></div><hr><h2>☆ 推し & FAVORITES</h2><div id="fav"></div><hr><h2>🔥 ちょっと聞きたい♡</h2><div id="adult"></div><hr><label>自由記入欄</label><textarea id="free"></textarea><div class="small">※本名・住所・電話番号など、個人情報は書かないでね。</div></div><div class="preview"><div class="book" id="book"><div class="bookhead"><img class="avatar" id="pPhoto"><div><div class="name" id="pName">My Profile</div><div class="birthday" id="pBirthday">誕生日を入力してね</div></div></div><div id="sections"></div></div><div class="actions"><button onclick="savePage()">完成ページを保存</button><button class="alt" onclick="clearAll()">リセット</button></div></div></div></div><script>
const groups={love:[['lovePerson','好きな人'],['type','好みのタイプ'],['loveTrigger','好きになるきっかけ'],['firstLove','一目惚れする？'],['chase','追う派？追われたい？'],['confess','告白する派？されたい？'],['ageType','年上・同い年・年下？'],['sweet','甘える派？甘えられたい？'],['possessive','独占欲は強い？'],['jealous','嫉妬するタイプ？'],['loveMode','恋愛するとどうなる？'],['date','理想のデート'],['loveRule','恋愛で譲れないこと'],['happyThing','恋人にされて嬉しいこと'],['wantedWords','恋人に言われたい言葉'],['role','あなたは受け攻め？（自由入力）']],fav:[['oshi','推し'],['oshiWhy','推しの好きなところ'],['manga','好きな漫画'],['anime','好きなアニメ'],['character','好きなキャラクター'],['dramaNow','好きなドラマ（今）'],['dramaOld','好きなドラマ（昔）'],['movie','好きな映画'],['music','好きな音楽'],['color','好きな色'],['food','好きな食べ物'],['animal','好きな動物'],['sameOshi','好きな人と推しは同じ？']],adult:[['fetish','フェチ・好きな部位'],['voice','好きな声'],['gesture','好きな仕草'],['habit','好きな癖'],['weakPoint','弱点'],['weakScene','弱いシチュエーション'],['dokidoki','されるとドキッとすること'],['adultMoment','大人っぽいと思う瞬間']]};
function makeInputs(){for(const [g,arr] of Object.entries(groups)){let e=document.getElementById(g);e.innerHTML=arr.map(([id,l])=>`<label>${l}</label><textarea id="${id}"></textarea>`).join('')}}makeInputs();
const base=[['name','名前・ハンドルネーム'],['birthday','誕生日'],['zodiac','星座'],['eto','干支'],['blood','血液型'],['hand','利き手'],['nickname','あだ名・呼ばれ方'],['personality','性格'],['holiday','休日の過ごし方'],['hobby','趣味'],['skill','特技'],['sns','SNS・活動場所']];
function v(id){let e=document.getElementById(id);return e?e.value.trim():''}function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){document.getElementById('pName').textContent=v('name')||'My Profile';document.getElementById('pBirthday').textContent=v('birthday')||'誕生日を入力してね';let s='<div class="section"><h3>My profile</h3><div class="cards">';for(const [id,l] of base){if(v(id))s+=`<div class="card"><div class="q">${l}</div><div class="a">${esc(v(id))}</div></div>`}s+='</div></div>';for(const [title,key] of [['♡ LOVE','love'],['☆ 推し & FAVORITES','fav'],['🔥 ちょっと聞きたい♡','adult']]){s+=`<div class="section"><h3>${title}</h3><div class="cards">`;for(const [id,l] of groups[key])if(v(id))s+=`<div class="card"><div class="q">${l}</div><div class="a">${esc(v(id))}</div></div>`;s+='</div></div>'}if(v('free'))s+=`<div class="section"><h3>Free space</h3><div class="card"><div class="a">${esc(v('free'))}</div></div></div>`;document.getElementById('sections').innerHTML=s;localStorage.mitta=document.querySelector('.panel').innerHTML}document.querySelectorAll('input,textarea').forEach(e=>e.addEventListener('input',render));document.getElementById('photo').onchange=e=>{let f=e.target.files[0];if(f){let r=new FileReader;r.onload=()=>document.getElementById('pPhoto').src=r.result;r.readAsDataURL(f)}};function clearAll(){if(confirm('全部消しますか？')){document.querySelectorAll('input,textarea').forEach(e=>{if(e.type!=='file')e.value=''});document.getElementById('pPhoto').src='';render()}}function savePage(){let blob=new Blob([document.documentElement.outerHTML],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mitta-profile.html';a.click()}render();</script></body></html>
