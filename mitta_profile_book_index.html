<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>みったー PROFILE BOOK</title><style>:root{--ink:#5d638e;--line:#d4d6eb}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f1efff,#edf8ff,#fff1f8);font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;color:var(--ink)}header{position:sticky;top:0;z-index:5;background:#fffffff0;padding:10px;border-bottom:1px solid var(--line)}header div{max-width:1100px;margin:auto;display:flex;gap:6px;justify-content:space-between;align-items:center;flex-wrap:wrap}.logo{font-size:20px;font-weight:900;color:#6b64b7}button{border:1px solid #cfd2e7;border-radius:999px;background:white;color:#60648f;padding:8px 12px;font-weight:700}.primary{background:#716ac6;color:white}main{max-width:1100px;margin:auto;padding:14px}.hero{text-align:center}.hero h1{font-size:clamp(30px,7vw,52px);margin:5px;color:#6962b8}.notice{background:#fff0f7;border:1px solid #efd0df;border-radius:18px;padding:9px;font-size:12px;margin:10px auto 16px;max-width:800px}.layout{display:grid;grid-template-columns:1fr 520px;gap:15px}.group{padding:13px;margin-bottom:12px;border:1px solid var(--line);border-radius:20px;background:#ffffffdd}.group h2{margin:0 0 8px;font-size:18px}.profile{background:#eef8ff}.love{background:#fff0f7}.fav{background:#f0f5ff}.adult{background:#ebfaf6}.if{background:#fff6dd}.q{background:#eef7ff}.people{background:#fff0f7}.other{background:#f1edff}label{display:block;font-size:13px;font-weight:700;margin:8px 0 3px}input,textarea{width:100%;border:1px solid #d7d9e9;border-radius:10px;padding:8px;background:#fff; color:#555b84}textarea{min-height:55px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{display:flex;flex-wrap:wrap;gap:6px}.choice label{font-weight:500;border:1px solid #ddd;border-radius:999px;padding:6px 9px;background:#fff}.choice input{width:auto}.photo{border:2px dashed #c6c2e6;padding:10px;border-radius:15px;margin-top:8px}.preview{position:sticky;top:65px}.card{aspect-ratio:1135/1386;border-radius:28px;padding:4%;overflow:hidden;background:radial-gradient(ellipse at 15% 15%,#dbe6ff 0 17%,transparent 18%),radial-gradient(ellipse at 80% 30%,#eadcff 0 20%,transparent 21%),radial-gradient(ellipse at 40% 80%,#d9f3ff 0 23%,transparent 24%),#faf9ff;border:7px solid #ffffffaa;box-shadow:0 12px 40px #7770a525}.card h1{margin:0;color:#6862b5;font-size:clamp(20px,4vw,38px)}.mini{font-size:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.box{border:1px solid #cfd3e8;border-radius:13px;padding:7px;background:#ffffffaa;min-height:75px}.box h3{font-size:10px;margin:0 0 4px}.box p{font-size:7.5px;margin:3px 0;line-height:1.4;word-break:break-word}.full{grid-column:1/-1}.adultbox{background:#ebfaf6aa}.peoplebox{background:#fff1f8aa}.photos{display:grid;grid-template-columns:1fr 1fr;gap:5px}.ph{height:72px;border:2px dashed #bdbddd;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#999}.ph img{width:100%;height:100%;object-fit:cover}.tools{display:flex;gap:6px;margin-top:7px}.tools button{flex:1}@media(max-width:850px){.layout{grid-template-columns:1fr}.preview{position:static}}footer{text-align:center;padding:25px;font-size:12px}</style></head><body><header><div><div class="logo">みったー PROFILE BOOK ♡</div><div><button onclick="saveData()">編集データ保存</button><button onclick="loadData()">読み込む</button><button onclick="resetAll()">リセット</button><button class="primary" onclick="png()">PNGで保存</button></div></div></header><main><section class="hero"><h1>みったー PROFILE BOOK</h1><p>みんなのことをもっと知りたい♡ 空欄OK・答えたいところだけどうぞ。</p><div class="notice">🔒 個人を特定できる情報は入力しないでね。本名・住所・電話番号・勤務先などはNG。SNSは任意。</div></section><div class="layout"><div id="form"></div><div class="preview"><div id="card" class="card"><h1>みったー PROFILE BOOK ♡</h1><div class="mini">みんな違って、みんないい。　🔒 個人情報は載せないでね</div><div class="grid" id="pv"></div></div><div class="tools"><button onclick="png()">📷 PNGで保存</button><button onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ 編集へ</button></div></div></div></main><footer>入力内容と画像はこのブラウザ内で処理します。</footer><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script>

['💕 LOVE','love',[['lovePerson','好きな人'],['type','好みのタイプ'],['loveTrigger','好きになるきっかけ'],['firstLove','一目惚れする？'],['chase','追う派？追われたい？'],['confess','告白する派？されたい？'],['ageType','年上・同い年・年下？'],['sweet','甘える派？甘えられたい？'],['possessive','独占欲は強い？'],['jealous','嫉妬するタイプ？'],['loveMode','恋愛するとどうなる？'],['date','理想のデート'],['loveRule','恋愛で譲れないこと'],['happyThing','恋人にされて嬉しいこと'],['wantedWords','恋人に言われたい言葉'],['role','あなたは受け攻め？（自由入力）']]],
['⭐ 推し & FAVORITES','fav',[['oshi','推し'],['oshiWhy','推しの好きなところ','ta'],['manga','好きな漫画'],['anime','好きなアニメ'],['character','好きなキャラクター'],['dramaNow','好きなドラマ（今）'],['dramaOld','好きなドラマ（昔）'],['movie','好きな映画'],['music','好きな音楽'],['color','好きな色'],['food','好きな食べ物'],['animal','好きな動物'],['sameOshi','好きな人と推しは同じ？']]],

['👑 みったーの○○な人','people',[['p1','一番朝が弱そうな人'],['p2','一番寝落ちしそうな人'],['p3','一番酒が強そうな人'],['p4','一番酔うと変わりそうな人'],['p5','一番モテそうな人'],['p6','一番恋愛すると重そうな人'],['p7','一番嫉妬深そうな人'],['p8','一番独占欲が強そうな人'],['p9','一番甘え上手そうな人'],['p10','一番甘やかし上手そうな人'],['p11','一番押しに弱そうな人'],['p12','一番押しが強そうな人'],['p13','一番照れ屋そうな人'],['p14','一番色気がありそうな人'],['p15','一番ギャップがありそうな人'],['p16','一番秘密が多そうな人'],['p17','一番意外な趣味がありそうな人'],['p18','一番一緒に旅行したい人'],['p19','一番一緒に飲みたい人'],['p20','一番デートしてみたい人'],['p21','一番相談しやすそうな人'],['p22','一番頼りになりそうな人'],['p23','一番面白い人'],['p24','一番変人そうな人']]],
['✨ OTHER','other',[['theme','好きなテーマ'],['best3','BEST 3','ta'],['gift','もらえるとうれしいプレゼント'],['challenge','チャレンジしてみたいこと'],['want','今ほしいもの'],['place','今一番行きたい場所'],['thisYear','今年やりたいこと'],['someday','いつかやってみたいこと'],['secret2','ここだけの秘密'],['free','Free Space','ta']]]];
let data=JSON.parse(localStorage.getItem('mittaProfile')||'{}');
function build(){const f=document.getElementById('form');f.innerHTML='';sections.forEach(([title,cls,fields])=>{let g=document.createElement('section');g.className='group '+cls;g.innerHTML='<h2>'+title+'</h2>';fields.forEach(([k,label,type])=>{let l=document.createElement('label');l.innerHTML=label;if(['firstLove','chase','confess','sameOshi'].includes(k)){l.innerHTML=label+'<input data-k="'+k+'" type="text" placeholder="自由入力でもOK">'}else if(type==='ta'){l.innerHTML=label+'<textarea data-k="'+k+'"></textarea>'}else l.innerHTML=label+'<input data-k="'+k+'" type="text">';g.appendChild(l)});f.appendChild(g)});let photo=document.createElement('div');photo.className='group';photo.innerHTML='<h2>📷 画像</h2><div class="photo">プロフィール画像<input id="photo1" type="file" accept="image/*"></div><div class="photo">追加写真（最大4枚）<input id="photos" type="file" accept="image/*" multiple></div>';f.appendChild(photo);f.querySelectorAll('[data-k]').forEach(e=>{e.value=data[e.dataset.k]||'';e.addEventListener('input',()=>{data[e.dataset.k]=e.value;localStorage.setItem('mittaProfile',JSON.stringify(data));render()})});document.getElementById('photo1').addEventListener('change',e=>previewFile(e.target.files[0],0));document.getElementById('photos').addEventListener('change',e=>[...e.target.files].slice(0,4).forEach((x,i)=>previewFile(x,i+1));}
function previewFile(file,i){if(!file)return;let r=new FileReader();r.onload=e=>{let im=document.getElementById('im'+i);if(im)im.src=e.target.result;else{let p=document.createElement('img');p.id='im'+i;p.src=e.target.result;p.style.display='none';document.body.appendChild(p)}localStorage.setItem('mittaPhoto'+i,e.target.result);renderPhotos()};r.readAsDataURL(file)}
function renderPhotos(){[0,1,2,3,4].forEach(i=>{let e=document.getElementById('pvim'+i);let s=localStorage.getItem('mittaPhoto'+i);if(e&&s)e.src=s})}
function val(k){return (data[k]||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function render(){let html='';const show=(k,l)=>'<p><b>'+l+'：</b>'+val(k)+'</p>';html+='<div class="box"><h3>👤 PROFILE</h3>'+show('name','名前')+show('birthday','誕生日')+show('zodiac','星座')+show('eto','干支')+show('blood','血液型')+show('personality','性格')+show('hobby','趣味')+show('sns','SNS')+'</div>';html+='<div class="box love"><h3>💕 LOVE</h3>'+show('lovePerson','好きな人')+show('type','タイプ')+show('chase','追う/追われたい')+show('sweet','甘える/甘えられたい')+show('loveMode','恋愛すると')+show('role','受け攻め')+'</div>';html+='<div class="box fav"><h3>⭐ 推し & FAVORITES</h3>'+show('oshi','推し')+show('manga','漫画')+show('dramaNow','ドラマ(今)')+show('dramaOld','ドラマ(昔)')+show('music','音楽')+show('color','色')+show('food','食べ物')+show('animal','動物')+'</div>';html+='<div class="box adultbox"><h3>🔥 ちょっと聞きたい♡</h3>'+show('fetish','フェチ')+show('voice','声')+show('gesture','仕草')+show('habit','癖')+show('weakPoint','弱点')+show('weakScene','弱いシチュ')+show('sexyMoment','色気を感じる瞬間')+show('secret','秘密♡')+'</div>';html+='<div class="box if"><h3>💡 IF…</h3>'+show('ifReborn','生まれ変わるなら')+show('ifMagic','魔法が使えたら')+show('ifMonth','1か月休み')+show('ifMoney','300万円')+show('ifIsland','無人島')+'</div>';html+='<div class="box"><h3>❓ QUESTIONS</h3>'+show('adultMoment','大人になった瞬間')+show('happyMoment','幸せ')+show('motto','座右の銘')+show('manual','取扱説明書')+show('memory','最近の思い出')+'</div>';html+='<div class="box peoplebox full"><h3>👑 みったーの○○な人</h3>'+show('p1','朝が弱そう')+show('p5','モテそう')+show('p9','甘え上手')+show('p11','押しに弱い')+show('p14','色気')+show('p16','秘密が多い')+show('p18','旅行したい')+show('p19','一緒に飲みたい')+show('p23','面白い')+'</div>';html+='<div class="box full"><h3>📷 PHOTO & FREE SPACE</h3><div class="photos"><div class="ph"><img id="pvim0"></div><div class="ph"><img id="pvim1"></div></div>'+show('free','Free Space')+'</div>';document.getElementById('pv').innerHTML=html;renderPhotos()}
function saveData(){localStorage.setItem('mittaProfile',JSON.stringify(data));alert('保存したよ♡')}function loadData(){data=JSON.parse(localStorage.getItem('mittaProfile')||'{}');build();render();alert('読み込んだよ♡')}function resetAll(){if(!confirm('全部消す？'))return;localStorage.removeItem('mittaProfile');[0,1,2,3,4].forEach(i=>localStorage.removeItem('mittaPhoto'+i));data={};build();render()}async function png(){const c=await html2canvas(document.getElementById('card'),{scale:2,backgroundColor:null,useCORS:true});let a=document.createElement('a');a.download='mitta-profile-book.png';a.href=c.toDataURL('image/png');a.click()}build();render();
</script></body></html>
